spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**, /api/users/**

        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/products/**, /api/books/**

        - id: inventory-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/inventory/**

        - id: cart-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/cart/**

        - id: order-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/orders/**

        - id: payment-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/payments/**

        - id: notification-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/notifications/**


server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info